# Gradle JVM: 2GB heap prevents OOM on CI runners; ParallelGC reduces pause times.
org.gradle.jvmargs=-Xmx2048m -Xms512m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError

# CI enforces --no-daemon via GRADLE_OPTS env; daemon=true is fine for local dev.
org.gradle.daemon=true

# Enable parallel builds on multi-core CI runners (ubuntu-latest has 4 vCPUs).
org.gradle.parallel=true
org.gradle.workers.max=4

# Configure on demand reduces configuration time for multi-module projects.
org.gradle.configureondemand=true

# Build cache speeds up repeated CI runs.
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
